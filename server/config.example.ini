# Settings for the Nokia SMS server.
# The installer copies this to /etc/nokia-sms/config.ini. Change it there, then restart:
#   sudo systemctl restart nokia-sms
# Lines starting with # are comments.

[server]
# Where the web page can be reached. 0.0.0.0:8095 = from every computer in your home network,
# at http://<this computer's address>:8095. Use 127.0.0.1:8095 to allow only this computer.
listen = 0.0.0.0:8095

[phone]
# "auto" looks for the phone on USB by itself. If you have more than one, pick it by hand:
# run  ls /dev/serial/by-id/  and put the full path here.
device = auto

[numbers]
# Your country's calling code without the +, so people can type numbers the way they're used to
# (0151 2345678 instead of +49 151 2345678). Examples: 49 Germany, 43 Austria, 44 UK, 31 Netherlands.
# Leave empty to make everyone type the +.
home_country =

# Only send to numbers that start like this. Empty = any number.
# Whole countries:   allow = +49 +43 +41
# Just your friends: allow = +491511234567 +491709876543
allow =

# Never send to numbers that start like this, even if they're allowed above.
# Good for expensive service numbers or someone who asked not to get any more SMS.
# Example: block = +49900 +4915199999999
block =

[limits]
# Every SMS is paid for by the SIM in your phone, so keep these low. 0 = no limit.
# All SMS together per day (resets at midnight):
sms_per_day = 20
# Per receiving number per day:
sms_per_number_per_day = 3

[access]
# If you set a password, people need it to send anything. Painting and downloading still
# works without it. Good idea if the page can be reached from the internet.
# (Don't use # or ; in the password.)
password =

[networks]
# Operator logos only show up on a phone when they're "for" the network of its SIM card.
# These networks are offered in a list on the page; people can always type in another code.
# Format:  Name = country code + network code (MCC MNC)
# Find codes at https://en.wikipedia.org/wiki/Mobile_country_code
# Remove the # in front of the ones you want, or add your own:
# Telekom (Germany) = 262 01
# Vodafone (Germany) = 262 02
# O2 (Germany) = 262 03
# A1 (Austria) = 232 01
# EE (UK) = 234 30
# KPN (Netherlands) = 204 08
